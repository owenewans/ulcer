name: release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26.0"
  MAGE_VERSION: "v1.17.2"
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install github.com/magefile/mage@${MAGE_VERSION}
      - run: sudo apt-get update && sudo apt-get install --yes podman
      - run: mage freeze
      - name: Build binaries
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" mage release:binaries
          done
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printenv GH_TOKEN | podman login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push runtime images
        id: images
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          : > dist/container-digests.txt
          for component in host instance ui caddy; do
            image="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/ulcer-${component}:${VERSION}"
            latest="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/ulcer-${component}:latest"
            podman build --file "deploy/Containerfile.${component}" --tag "$image" .
            podman push --digestfile "dist/${component}.digest" "$image"
            podman tag "$image" "$latest"
            podman push "$latest"
            name="${image%:*}"
            digest="$(cat "dist/${component}.digest")"
            printf '%s@%s\n' "$name" "$digest" >> dist/container-digests.txt
            printf '%s_name=%s\n' "$component" "$name" >> "$GITHUB_OUTPUT"
            printf '%s_digest=%s\n' "$component" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s_image=%s@%s\n' "$component" "$name" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Build deployment bundle
        env:
          HOST_DIGEST: ${{ steps.images.outputs.host_digest }}
          INSTANCE_DIGEST: ${{ steps.images.outputs.instance_digest }}
          UI_DIGEST: ${{ steps.images.outputs.ui_digest }}
          CADDY_DIGEST: ${{ steps.images.outputs.caddy_digest }}
        run: |
          staging="$(mktemp -d)"
          mkdir -p "$staging/ulcer/quadlet"
          cp deploy/quadlet/* "$staging/ulcer/quadlet/"
          cp deploy/Caddyfile deploy/nftables.conf .env.example README.md LICENSE "$staging/ulcer/"
          cp docs/deployment.md versions/engines.json versions/sources.json "$staging/ulcer/"
          sed -i "s/REPLACE_WITH_RELEASE_DIGEST/${HOST_DIGEST#sha256:}/" "$staging/ulcer/quadlet/ulcer-host.container"
          sed -i "s/REPLACE_WITH_RELEASE_DIGEST/${INSTANCE_DIGEST#sha256:}/" "$staging/ulcer/quadlet/ulcer-instance@.container"
          sed -i "s/REPLACE_WITH_RELEASE_DIGEST/${UI_DIGEST#sha256:}/" "$staging/ulcer/quadlet/ulcer-ui.container"
          sed -i "s/REPLACE_WITH_RELEASE_DIGEST/${CADDY_DIGEST#sha256:}/" "$staging/ulcer/quadlet/ulcer-caddy.container"
          tar --create --gzip --file "dist/ulcer-deployment-${GITHUB_REF_NAME}.tar.gz" -C "$staging" ulcer
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.images.outputs.host_image }}
          output-file: dist/host.spdx.json
          format: spdx-json
          syft-version: v1.51.0
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.images.outputs.instance_image }}
          output-file: dist/instance.spdx.json
          format: spdx-json
          syft-version: v1.51.0
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.images.outputs.ui_image }}
          output-file: dist/ui.spdx.json
          format: spdx-json
          syft-version: v1.51.0
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.images.outputs.caddy_image }}
          output-file: dist/caddy.spdx.json
          format: spdx-json
          syft-version: v1.51.0
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign runtime images
        run: |
          while IFS= read -r image; do
            cosign sign --yes "$image"
          done < dist/container-digests.txt
      - run: mage release:checksums
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.host_name }}
          subject-digest: ${{ steps.images.outputs.host_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.instance_name }}
          subject-digest: ${{ steps.images.outputs.instance_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.ui_name }}
          subject-digest: ${{ steps.images.outputs.ui_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.images.outputs.caddy_name }}
          subject-digest: ${{ steps.images.outputs.caddy_digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/*
          versions/engines.json
          versions/sources.json
          --title "ulcer ${GITHUB_REF_NAME}"
          --generate-notes
